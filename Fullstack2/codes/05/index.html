<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Título del sitio</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <section>
      <h1>Ejemplo JavaScript</h1>
    </section>

    <section>
      <h2 id="titulo">Esto es un título</h2>
      <p class="description">Esto es un párrafo.</p>
    </section>

    <section>
      <button id="btnSaludar" type="button">Saludar</button>
      <p id="msgSaludar"></p>
    </section>

    <section>
      <div id="tarjeta">Pasar el mouse sobre este elemento</div>
    </section>

    <section>
      <label for="nombreInput">Nombre: </label>
      <input id="txtNombre" type="text" />
      <button id="btnMostrar">Mostrar texto</button>
      <p id="textoSalida"></p>
    </section>

    <section>
      <h2 id="textoCambiar">Texto a cambiar</h2>
      <button id="btnTextoACambiar" type="button">
        Presione para cambiar el texto del título de la sección.
      </button>
    </section>

    <section>
      <input type="text" id="nuevaTarea" placeholder="Escriba una tarea" />
      <button id="btnAgregarTarea">Agregar</button>
      <ul id="listaTareas"></ul>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- <script> -->
    <!--   console.log("Hola mundo"); -->
    <!--   alert("Hola"); -->
    <!-- </script> -->
    <script src="js/ejemplos.js"></script>
  </body>
</html>
