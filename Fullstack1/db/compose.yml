services:
  db:
    container_name: fullstack1
    image: mysql:oraclelinux9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fullstack1
      MYSQL_DATABASE: testdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - fullstack

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: fullstack-1
    ports:
      - "8080:80"
    networks:
      - fullstack

networks:
  fullstack:
    driver: bridge

volumes:
  mysql-data:
